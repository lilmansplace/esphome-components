# Shared Si4703 FM radio package (board-independent) - upstream-style component.
# Include from a board file that defines these substitutions:
#   sdio_pin, sclk_pin, reset_pin, start_frequency
# Optional: region (americas | europe | australia | japan | japan_wide), default americas.
# Provides: tuning, volume, mute/mono, seek, RDS station name + text, signal strength,
# 6 presets (drop-down + Tune/Store/Next/Previous), "Auto-program Presets" (adaptive band scan,
# strongest 6 stations), "Scan Band" (scan only), and restores last station/volume/seek threshold.

substitutions:
  region: americas

esphome:
  on_boot:
    priority: -100
    then:
      # Values set before the tuner finishes powering up are applied when it does
      - lambda: |-
          id(radio).set_seek_threshold(id(last_seek_threshold));
          id(radio).set_volume(id(last_volume));
          id(radio).set_frequency(id(last_frequency));
      - component.update: preset_info
      - component.update: preset_list

external_components:
  - source: github://lilmansplace/esphome-components@si4703-upstream
    components: [si4703]
    refresh: 0s

i2c:
  id: i2c_bus
  sda:
    number: ${sdio_pin}
    allow_other_uses: true   # shared with si4703 sdio_pin (used only during reset)
  scl: ${sclk_pin}
  frequency: 100kHz
  scan: true

globals:
  - id: last_frequency
    type: float
    restore_value: true
    initial_value: '${start_frequency}'
  - id: last_seek_threshold
    type: int
    restore_value: true
    initial_value: '10'
  - id: last_volume
    type: int
    restore_value: true
    initial_value: '8'
  # Auto-program state (not persisted)
  - id: autoprog_active
    type: bool
    initial_value: 'false'
  - id: autoprog_saved_threshold
    type: int
    initial_value: '10'
  - id: autoprog_threshold
    type: int
    initial_value: '10'
  - id: presets
    type: std::array<float, 6>
    restore_value: true
    initial_value: 'std::array<float, 6>{88.1f, 96.3f, 97.1f, 99.5f, 101.9f, 102.7f}'

si4703:
  id: radio
  reset_pin: ${reset_pin}
  sdio_pin:
    number: ${sdio_pin}
    allow_other_uses: true
  region: ${region}
  frequency: ${start_frequency}
  volume: 8
  status_text: true          # show "FM 99.5" / "Preset 3 · FM 99.5" / "Scanning…" until RDS arrives
  on_scan_complete:
    - component.update: scan_results
    - if:
        condition:
          lambda: 'return id(autoprog_active);'
        then:
          - script.execute: autoprog_step

script:
  # One step of Auto-program: runs after each scan. Lowers the seek threshold and rescans until
  # 6 stations are found (or the threshold reaches 0), then writes the presets.
  - id: autoprog_step
    mode: queued
    then:
      - wait_until:
          condition:
            lambda: 'return !id(radio).is_busy();'
          timeout: 5s
      - lambda: |-
          const uint8_t n = id(radio).get_scan_count();
          if (n < 6 && id(autoprog_threshold) > 0) {
            id(autoprog_threshold) = std::max(0, id(autoprog_threshold) - 4);
            ESP_LOGI("autoprog", "Found %u station(s); rescanning at seek threshold %d", n, id(autoprog_threshold));
            id(radio).set_seek_threshold(id(autoprog_threshold));
            char label[33];
            snprintf(label, sizeof(label), "Auto-programming \u00b7 %d dB\u00b5V", id(autoprog_threshold));
            id(radio).set_station_name_status(label);
            id(radio).start_scan();
            return;
          }
          id(autoprog_active) = false;
          id(radio).set_seek_threshold(id(autoprog_saved_threshold));
          id(autoprog_watchdog).stop();
          if (n == 0) {
            ESP_LOGW("autoprog", "Auto-program failed: no stations found - presets unchanged");
            return;
          }
          // Results arrive strongest first: keep the best 6, order them by frequency, and repeat
          // stations to fill the slots if fewer than 6 were found.
          const uint8_t k = n < 6 ? n : 6;
          std::array<float, 6> top{};
          for (uint8_t i = 0; i < k; i++)
            top[i] = id(radio).get_scan_frequency(i);
          std::sort(top.begin(), top.begin() + k);
          for (uint8_t i = 0; i < 6; i++) {
            id(presets)[i] = top[i % k];
            ESP_LOGI("autoprog", "Preset %u = %.1f MHz", (unsigned) (i + 1), id(presets)[i]);
          }
          if (k < 6)
            ESP_LOGW("autoprog", "Only %u station(s) found; repeated them to fill all 6 presets", k);
          id(preset_info).update();
          id(preset_list).update();

  # Safety net: if an auto-program run is interrupted (e.g. a manual tune cancels the scan),
  # put the user's seek threshold back.
  - id: autoprog_watchdog
    mode: restart
    then:
      - delay: 120s
      - lambda: |-
          if (id(autoprog_active)) {
            id(autoprog_active) = false;
            id(radio).set_seek_threshold(id(autoprog_saved_threshold));
            ESP_LOGW("autoprog", "Auto-program interrupted - presets unchanged");
          }

sensor:
  - platform: si4703
    frequency:
      name: "Tuned Frequency"
      on_value:
        - lambda: 'id(last_frequency) = x;'
    rssi:
      name: "Signal Strength"

text_sensor:
  - platform: si4703
    station_name:
      name: "Station Name"
    radio_text:
      name: "Radio Text"

  - platform: template
    name: "Preset Frequency"
    id: preset_info
    icon: mdi:playlist-star
    update_interval: never
    lambda: |-
      auto idx = id(preset_select).active_index();
      if (!idx.has_value()) return {""};
      char buf[32];
      snprintf(buf, sizeof(buf), "Preset %u: %.1f MHz", (unsigned) (*idx + 1), id(presets)[*idx]);
      return {std::string(buf)};

  - platform: template
    name: "Preset List"
    id: preset_list
    icon: mdi:format-list-numbered
    update_interval: never
    lambda: |-
      std::string out;
      char buf[16];
      for (size_t i = 0; i < id(presets).size(); i++) {
        snprintf(buf, sizeof(buf), "%s%u: %.1f", i ? " | " : "", (unsigned) (i + 1), id(presets)[i]);
        out += buf;
      }
      return {out};

  - platform: template
    name: "Scan Results"
    id: scan_results
    icon: mdi:radar
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      std::string out;
      char buf[24];
      const uint8_t n = id(radio).get_scan_count();
      for (uint8_t i = 0; i < n && out.size() < 230; i++) {
        snprintf(buf, sizeof(buf), "%s%.1f (%u)", i ? ", " : "", id(radio).get_scan_frequency(i),
                 id(radio).get_scan_rssi(i));
        out += buf;
      }
      return {n ? out : std::string("none")};

binary_sensor:
  - platform: si4703
    stereo:
      name: "Stereo"

number:
  - platform: si4703
    frequency:
      name: "Frequency"
      mode: box
    volume:
      name: "Volume"
      mode: slider
      on_value:
        - lambda: 'id(last_volume) = (int) x;'
    seek_threshold:
      name: "Seek Threshold"
      mode: slider
      on_value:
        - lambda: |-
            if (!id(autoprog_active))   // don't persist the temporary auto-program values
              id(last_seek_threshold) = (int) x;

switch:
  - platform: si4703
    mute:
      name: "Mute"
    mono:
      name: "Force Mono"

select:
  - platform: template
    name: "Preset"
    id: preset_select
    icon: mdi:playlist-star
    optimistic: true
    restore_value: true
    options:
      - "Preset 1"
      - "Preset 2"
      - "Preset 3"
      - "Preset 4"
      - "Preset 5"
      - "Preset 6"
    initial_option: "Preset 1"
    on_value:
      - component.update: preset_info

button:
  - platform: si4703
    seek_up:
      name: "Seek Up"
    seek_down:
      name: "Seek Down"
    scan:
      name: "Scan Band"

  - platform: template
    name: "Auto-program Presets"
    icon: mdi:playlist-star
    on_press:
      - if:
          condition:
            lambda: 'return id(autoprog_active) || id(radio).is_busy();'
          then:
            - logger.log:
                level: WARN
                tag: autoprog
                format: "Radio busy - auto-program ignored"
          else:
            - lambda: |-
                id(autoprog_active) = true;
                id(autoprog_saved_threshold) = id(radio).get_seek_threshold();
                id(autoprog_threshold) = id(autoprog_saved_threshold);
                ESP_LOGI("autoprog", "Auto-programming presets (seek threshold %d)", id(autoprog_threshold));
                id(radio).set_station_name_status("Auto-programming\u2026");
                id(radio).start_scan();
            - script.execute: autoprog_watchdog

  - platform: template
    name: "Tune Preset"
    icon: mdi:radio
    on_press:
      - lambda: |-
          auto idx = id(preset_select).active_index();
          if (!idx.has_value()) return;
          float f = id(presets)[*idx];
          ESP_LOGI("preset", "Tuning to preset %u: %.1f MHz", (unsigned) (*idx + 1), f);
          char label[33];
          snprintf(label, sizeof(label), "Preset %u \u00b7 FM %.1f", (unsigned) (*idx + 1), f);
          id(radio).set_station_name_status(label);
          id(radio).set_frequency(f);

  - platform: template
    name: "Store Preset"
    icon: mdi:content-save
    on_press:
      - lambda: |-
          auto idx = id(preset_select).active_index();
          if (!idx.has_value()) return;
          float f = id(radio).get_frequency();
          id(presets)[*idx] = f;
          ESP_LOGI("preset", "Stored %.1f MHz in preset %u", f, (unsigned) (*idx + 1));
      - component.update: preset_info
      - component.update: preset_list

  - platform: template
    name: "Next Preset"
    icon: mdi:skip-forward
    on_press:
      - select.next:
          id: preset_select
          cycle: true
      - lambda: |-
          auto idx = id(preset_select).active_index();
          if (!idx.has_value()) return;
          char label[33];
          snprintf(label, sizeof(label), "Preset %u \u00b7 FM %.1f", (unsigned) (*idx + 1), id(presets)[*idx]);
          id(radio).set_station_name_status(label);
          id(radio).set_frequency(id(presets)[*idx]);

  - platform: template
    name: "Previous Preset"
    icon: mdi:skip-backward
    on_press:
      - select.previous:
          id: preset_select
          cycle: true
      - lambda: |-
          auto idx = id(preset_select).active_index();
          if (!idx.has_value()) return;
          char label[33];
          snprintf(label, sizeof(label), "Preset %u \u00b7 FM %.1f", (unsigned) (*idx + 1), id(presets)[*idx]);
          id(radio).set_station_name_status(label);
          id(radio).set_frequency(id(presets)[*idx]);

  - platform: restart
    name: "Restart"
