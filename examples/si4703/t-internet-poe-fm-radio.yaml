# LilyGO T-Internet-POE + SparkFun Si4703 FM tuner (WRL-12938), Ethernet/PoE
#
# Wiring:
#   Si4703 SDIO -> GPIO14
#   Si4703 SCLK -> GPIO33
#   Si4703 RST  -> GPIO32
#   Si4703 SEN  -> leave UNCONNECTED (SparkFun board pulls it high = I2C mode). Do NOT ground it.
#   Si4703 3.3V -> 3V3, GND -> GND
#   Headphones in the 3.5mm jack (the headphone cord is the antenna)
#
# All radio features (presets, seek threshold, RDS, ...) come from radio-common.yaml.

substitutions:
  name: poe-fm-radio
  friendly_name: PoE FM Radio
  sdio_pin: GPIO14
  sclk_pin: GPIO33
  reset_pin: GPIO32
  start_frequency: "88.1"     # used only on the very first boot

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO17_OUT
  phy_addr: 0

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

web_server:
  port: 80

packages:
  fm_radio:
    url: https://github.com/lilmansplace/esphome-components
    ref: si4703-upstream
    files: [components/si4703/radio-common.yaml]
    refresh: 0s
